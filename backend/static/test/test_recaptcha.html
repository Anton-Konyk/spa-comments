<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>reCAPTCHA Token Test</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <h3>Тест Google reCAPTCHA v2</h3>

    <div class="g-recaptcha" data-sitekey="RECAPTCHA_SITE_KEY" data-callback="onRecaptchaSuccess"></div>

    <button id="copyBtn" disabled>Copy token</button>

    <p>Teken: <span id="tokenDisplay">—</span></p>

    <script>
        let currentToken = "";

        function onRecaptchaSuccess(token) {
            currentToken = token;
            document.getElementById("tokenDisplay").textContent = token;
            document.getElementById("copyBtn").disabled = false;
        }

        document.getElementById("copyBtn").addEventListener("click", () => {
            if (!currentToken) return;
            navigator.clipboard.writeText(currentToken).then(() => {
                alert("Token copied! Can be pasted into Swagger.");
            });
        });
    </script>
</body>
</html>
